[package]
name = "scene-editor"
version = "0.1.2"
description = "Unofficial Magic Rampage Scene Editor"
authors = ["Quang Sang Pham"]
edition = "2021"

[lib]
name = "scene_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
