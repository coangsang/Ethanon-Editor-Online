name: Release desktop applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Run tests
        run: pnpm test

      - name: Verify third-party notices
        run: pnpm notices:check

      - name: Run lint
        run: pnpm lint

      - name: Build web application
        run: pnpm build

  create_release:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Create or reuse draft prerelease
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME already exists and is not a draft." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Unofficial Magic Rampage Scene Editor $GITHUB_REF_NAME" \
              --notes "Experimental unsigned Windows x64, Linux x64, macOS Intel, and macOS Apple Silicon builds. Back up projects before editing and verify the SHA-256 checksum before installing." \
              --draft \
              --prerelease
          fi

          release_id=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.architecture }}
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            architecture: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            extensions: .exe
          - platform: linux
            architecture: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            extensions: .AppImage,.deb
          - platform: macos
            architecture: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            extensions: .dmg
          - platform: macos
            architecture: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            extensions: .dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      - name: Verify Windows installer resources
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $installer = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File -Filter '*.exe')
          if ($installer.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installer.Count)."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'nsis-contents'
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw '7-Zip is required to inspect the NSIS installer.'
          }
          & $sevenZip x $installer[0].FullName "-o$extractRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to extract the NSIS installer.'
          }

          foreach ($name in @('THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_LICENSES.md')) {
            $packaged = @(Get-ChildItem -LiteralPath $extractRoot -Recurse -File -Filter $name)
            if ($packaged.Count -ne 1) {
              throw "Expected one packaged $name, found $($packaged.Count)."
            }
            $expected = (Get-FileHash -Algorithm SHA256 -LiteralPath $name).Hash
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $packaged[0].FullName).Hash
            if ($actual -ne $expected) {
              throw "Packaged notice resource differs: $name"
            }
          }

      - name: Verify Linux bundle resources
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          mapfile -t appimages < <(find "$bundle_root" -type f -name '*.AppImage')
          mapfile -t debs < <(find "$bundle_root" -type f -name '*.deb')
          [[ ${#appimages[@]} -eq 1 ]] || { echo "Expected one AppImage." >&2; exit 1; }
          [[ ${#debs[@]} -eq 1 ]] || { echo "Expected one deb package." >&2; exit 1; }

          verify_notices() {
            local root="$1"
            for name in THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md; do
              mapfile -t packaged < <(find "$root" -type f -name "$name")
              [[ ${#packaged[@]} -eq 1 ]] || { echo "Expected one packaged $name." >&2; exit 1; }
              cmp "$name" "${packaged[0]}"
            done
          }

          extract_root=$(mktemp -d)
          appimage=$(realpath "${appimages[0]}")
          mkdir "$extract_root/appimage" "$extract_root/deb"
          (cd "$extract_root/appimage" && "$appimage" --appimage-extract >/dev/null)
          dpkg-deb --extract "${debs[0]}" "$extract_root/deb"
          verify_notices "$extract_root/appimage"
          verify_notices "$extract_root/deb"

      - name: Verify macOS disk image resources
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          disk_images=()
          while IFS= read -r item; do disk_images+=("$item"); done < <(find "$bundle_root" -type f -name '*.dmg')
          [[ ${#disk_images[@]} -eq 1 ]] || { echo "Expected one DMG." >&2; exit 1; }

          mount_point=$(mktemp -d)
          cleanup() { hdiutil detach "$mount_point" -quiet || true; }
          trap cleanup EXIT
          hdiutil attach "${disk_images[0]}" -readonly -nobrowse -mountpoint "$mount_point" -quiet
          for name in THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md; do
            packaged=()
            while IFS= read -r item; do packaged+=("$item"); done < <(find "$mount_point" -type f -name "$name")
            [[ ${#packaged[@]} -eq 1 ]] || { echo "Expected one packaged $name." >&2; exit 1; }
            cmp "$name" "${packaged[0]}"
          done

      - name: Prepare deterministic release assets
        shell: bash
        run: |
          node scripts/prepare-release-assets.mjs \
            "src-tauri/target/${{ matrix.target }}/release/bundle" \
            "$GITHUB_REF_NAME" \
            "${{ matrix.platform }}" \
            "${{ matrix.architecture }}" \
            "${{ matrix.extensions }}"

      - name: Upload bundles and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
        run: |
          test -n "$RELEASE_ID"
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
